        { id: 'exp-5', date: '2026-11-10', category: 'Grocery', amount: 1350, site: 'Workshop Pantry', note: 'Tea powder, sugar, drinking water & snacks' },
        { id: 'exp-6', date: '2026-08-21', category: 'Transport', amount: 1800, site: 'Manjeri Villa Site', note: 'Glass panel shifting vehicle' },
        { id: 'exp-7', date: '2026-07-16', category: 'Petrol', amount: 2100, site: 'Perinthalmanna Block A', note: 'Generator & site vehicle fuel' },
        { id: 'exp-8', date: '2026-05-18', category: 'Staff Food', amount: 1450, site: 'Manjeri Villa Site', note: 'Overtime night installation dinner' }
      ]

    let state = loadState();
    let currentTab = 'overview';
    let viewMode = window.innerWidth < 768 ? 'app' : 'web';
    let selectedCustomerId = state.customers[0]?.id || null;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_DATA));
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderCurrentTab();
    }

    function resetDemoData() {
      if (confirm('Reset all Windoora Engineering records back to sample data?')) {
        state = JSON.parse(JSON.stringify(DEFAULT_DATA));
        selectedCustomerId = state.customers[0]?.id || null;
        saveState();
      }
    }

    // ==========================================
    // FORMATTING & CALCULATIONS
    // ==========================================
    const fmtINR = (num) => '₹' + Number(num || 0).toLocaleString('en-IN');

    function getCustomerTotals(cust) {
      let billed = 0;
      let received = 0;
      cust.works.forEach(w => {
        billed += Number(w.totalAmount || 0);
        w.payments.forEach(p => received += Number(p.amount || 0));
      });
      return { billed, received, due: billed - received };
    }

    function getAllMetrics() {
      let totalCustomerBilled = 0;
      let totalCustomerReceived = 0;
      state.customers.forEach(c => {
        const t = getCustomerTotals(c);
        totalCustomerBilled += t.billed;
        totalCustomerReceived += t.received;
      });
      const customerDue = totalCustomerBilled - totalCustomerReceived;

      let totalPurchase = 0;
      let totalPurchasePaid = 0;
      state.purchases.forEach(p => {
        totalPurchase += Number(p.totalAmount || 0);
        totalPurchasePaid += Number(p.paidAmount || 0);
      });
      const purchaseDue = totalPurchase - totalPurchasePaid;

      let totalPayrollEarned = 0;
      let totalPayrollPaid = 0;
      state.staff.forEach(s => {
        const earned = Number(s.baseSalary || 0) + (Number(s.otHours || 0) * Number(s.otRate || 0));
        totalPayrollEarned += earned;
        totalPayrollPaid += Number(s.paidAmount || 0);
      });
      const staffDue = totalPayrollEarned - totalPayrollPaid;

      let totalDailyExpenses = 0;
      state.expenses.forEach(e => totalDailyExpenses += Number(e.amount || 0));

      const netCashFlow = totalCustomerReceived - (totalPurchasePaid + totalPayrollPaid + totalDailyExpenses);

      return {
        totalCustomerBilled,
        totalCustomerReceived,
        customerDue,
        totalPurchase,
        totalPurchasePaid,
        purchaseDue,
        totalPayrollEarned,
        totalPayrollPaid,
        staffDue,
        totalDailyExpenses,
        netCashFlow
      };
    }

    // ==========================================
    // VIEW MODE SWITCHING (WEBSITE VS APP VIEW)
    // ==========================================
    function setViewMode(mode) {
      viewMode = mode;
      const body = document.body;
      const statusBar = document.getElementById('mobile-status-bar');
      const sidebar = document.getElementById('desktop-sidebar');
      const bottomNav = document.getElementById('bottom-nav');
      const appFab = document.getElementById('app-fab');
      const btnWeb = document.getElementById('btn-web-view');
      const btnApp = document.getElementById('btn-app-view');

      if (mode === 'app') {
        body.classList.add('app-mode');
        statusBar.classList.remove('hidden');
        sidebar.classList.add('lg:hidden');
        sidebar.classList.remove('lg:flex');
        bottomNav.classList.remove('lg:hidden');
        appFab.classList.remove('hidden');

        btnApp.classList.add('bg-white', 'text-[#1B365D]', 'shadow');
        btnApp.classList.remove('text-blue-100');
        btnWeb.classList.remove('bg-white', 'text-[#1B365D]', 'shadow');
        btnWeb.classList.add('text-blue-100');
      } else {
        body.classList.remove('app-mode');
        statusBar.classList.add('hidden');
        sidebar.classList.remove('lg:hidden');
        sidebar.classList.add('lg:flex');
        bottomNav.classList.add('lg:hidden');
        appFab.classList.add('hidden');

        btnWeb.classList.add('bg-white', 'text-[#1B365D]', 'shadow');
        btnWeb.classList.remove('text-blue-100');
        btnApp.classList.remove('bg-white', 'text-[#1B365D]', 'shadow');
        btnApp.classList.add('text-blue-100');
      }
      renderCurrentTab();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        if (btn.dataset.tab === tab) {
          btn.classList.add('bg-[#1B365D]', 'text-white');
          btn.classList.remove('text-slate-600', 'hover:bg-slate-100');
        } else {
          btn.classList.remove('bg-[#1B365D]', 'text-white');
          btn.classList.add('text-slate-600', 'hover:bg-slate-100');
        }
      });
      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        if (btn.dataset.tab === tab) {
          btn.classList.add('text-[#1B365D]', 'font-bold');
          btn.classList.remove('text-slate-400', 'font-medium');
        } else {
          btn.classList.remove('text-[#1B365D]', 'font-bold');
          btn.classList.add('text-slate-400', 'font-medium');
        }
      });
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (currentTab === 'overview') container.innerHTML = renderOverview();
      if (currentTab === 'customers') container.innerHTML = renderCustomers();
      if (currentTab === 'purchases') container.innerHTML = renderPurchases();
      if (currentTab === 'staff') container.innerHTML = renderStaff();
      if (currentTab === 'expenses') container.innerHTML = renderExpenses();
      lucide.createIcons();
    }

    // 1. OVERVIEW & 1-YEAR LEDGER
    function renderOverview() {
      const m = getAllMetrics();
      const months = [
        { key: '2026-04', label: 'Apr 2026' },
        { key: '2026-05', label: 'May 2026' },
        { key: '2026-06', label: 'Jun 2026' },
        { key: '2026-07', label: 'Jul 2026' },
        { key: '2026-08', label: 'Aug 2026' },
        { key: '2026-09', label: 'Sep 2026' },
        { key: '2026-10', label: 'Oct 2026' },
        { key: '2026-11', label: 'Nov 2026' },
        { key: '2026-12', label: 'Dec 2026' },
        { key: '2027-01', label: 'Jan 2027' },
        { key: '2027-02', label: 'Feb 2027' },
        { key: '2027-03', label: 'Mar 2027' }
      ];

      const monthlyRows = months.map(mo => {
        let custIn = 0;
        state.customers.forEach(c => c.works.forEach(w => w.payments.forEach(p => {
          if (p.date.startsWith(mo.key)) custIn += Number(p.amount);
        })));
        let purOut = 0;
        state.purchases.forEach(p => {
          if (p.date.startsWith(mo.key)) purOut += Number(p.paidAmount);
        });
        let expOut = 0;
        state.expenses.forEach(e => {
          if (e.date.startsWith(mo.key)) expOut += Number(e.amount);
        });
        const net = custIn - (purOut + expOut);
        return { ...mo, custIn, purOut, expOut, net };
      });

      return `

          <div>

      const s = state.staff.find(x => x.id === staffId);
      const earned = Number(s.baseSalary) + (Number(s.otHours) * Number(s.otRate));
      const pending = earned - Number(s.paidAmount);
      const amt = prompt(`Pending salary for ${s.name} is ₹${pending}. Enter payout amount:`, pending > 0 ? pending : 0);
      if (amt && !isNaN(amt)) {
        s.paidAmount = Number(s.paidAmount) + Number(amt);
        saveState();
      }
    }

            <strong>Customer:</strong> ${cust.name} (${cust.phone})<br/>
            <strong>Location:</strong> ${cust.location}<br/>
            <strong>Statement Date:</strong> ${new Date().toLocaleDateString('en-IN')}
          </div>
          ${cust.works.map(w => {
            const paid = w.payments.reduce((a, p) => a + Number(p.amount), 0);
            return `
              <div style="border:1px solid #cbd5e1; padding:10px; margin-bottom:12px; border-radius:6px; font-size:12px;">
                <strong>${w.docType} #${w.docNo} — ${w.title}</strong> (${w.date})<br/>
                Total Value: <strong>${fmtINR(w.totalAmount)}</strong> | Received: <strong>${fmtINR(paid)}</strong> | Balance Due: <strong>${fmtINR(w.totalAmount - paid)}</strong>
                <ul style="margin:6px 0 0; padding-left:18px;">
                  ${w.payments.map(p => `<li>${p.date}: ${fmtINR(p.amount)} (${p.note})</li>`).join('')}
                </ul>
              </div>
            `;
          }).join('')}
          <div style="background:#f1f5f9; padding:12px; border-radius:6px; font-size:14px; font-weight:bold;">
            Total Works: ${fmtINR(t.billed)} &nbsp;|&nbsp; Total Given: ${fmtINR(t.received)} &nbsp;|&nbsp; Net Balance Due: ${fmtINR(t.due)}
          </div>
        </div>
      `);
    }

    // Initialize App
    setViewMode(viewMode);
  </script>
</body>
</html>
